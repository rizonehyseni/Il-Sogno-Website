<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Il Sogno</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/CSS/reservations.css" />
    <script src="/JS/reservations.js" defer></script>
    <script src="../Components/navbar.js"></script>
    <script src="../Components/navbar.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>

  <body>
    <my-navbar> </my-navbar>
    <video class="video-background" autoplay muted loop>
      <source src="/photos/seaside-view.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>

    <a href="../HTML/index.html" class="floatingButton">Kthehu mbrapa</a>

    <section class="banner">
      <h2>Book your table</h2>

      <div class="form-container">
        <form action="" id="bookingForm">
          <div class="form-row">
            <input
              id="date-picker"
              type="text"
              placeholder="Select Date "
              required
            />

            <input
              id="time-picker"
              type="text"
              placeholder="Select Time"
              required
            />
          </div>

          <div class="form-row">
            <input id="fullname" type="text" placeholder="Full Name" required />
            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number "
              required
            />
          </div>

          <div class="form-row">
            <input type="email" id="email" placeholder="Your Email" required />

            <input
              type="number"
              placeholder="How many people?"
              min="1"
              max="20"
              required
            />
          </div>

          <div class="form-row">
            <input id="comments" placeholder="Additional comments (optional)" />
            <input type="submit" value="BOOK TABLE" />
          </div>
        </form>
      </div>
    </section>

    <!-- pop-up -->
    <div id="successPopup">
      <div class="Popup-window">
        <h2>Reservation complete</h2>
        <img src="../photos/IlSogno.png" style="width: 180px" alt="" />
        <p>
          Thank you for choosing Il Sogno.<br />
          Bienvenuto!
        </p>

        <!-- <button id="closePopup">CLOSE</button> -->
      </div>
    </div>
  </body>
</html>
