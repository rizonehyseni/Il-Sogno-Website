<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Il Sogno</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="/CSS/reservations.css">
  <script src="/JS/reservations.js" defer></script>
  <script src="../Components/navbar.js"></script>

</head>

<body>
<video class="video-background" autoplay muted loop playsinline>
    <source src="/photos/seaside-view.mp4" type="video/mp4">
    
  </video>
  <div class="video-overlay"></div>

  
  <section class="banner">
    <h2>Book your table</h2>

    <div class="form-container">
      <h1></h1>

      <form action="">
      
        <div class="form-row">
          <input type="date" name="reservation-date" min="2025-10-17" max="2025-12-31" required>

          <select name="hours" required>
            <option value="" disabled selected>Select Time</option>
            <option value="17:00">5:00 PM</option>
            <option value="17:30">5:30 PM</option>
            <option value="18:00">6:00 PM</option>
            <option value="18:30">6:30 PM</option>
            <option value="19:00">7:00 PM</option>
            <option value="19:30">7:30 PM</option>
            <option value="20:00">8:00 PM</option>
            <option value="20:30">8:30 PM</option>
            <option value="21:00">9:00 PM</option>
          </select>
        </div>

        <div class="form-row">
          <input type="text" placeholder="Full Name" required>
          <input type="tel" placeholder="Phone Number" required>
        </div>

        <div class="form-row">
          <input type="number" placeholder="How many people?" min="1" max="20" required>
          <input type="submit" value="BOOK TABLE">
        </div>
      </form>
    </div>
  </section>

























</body>

</html>
