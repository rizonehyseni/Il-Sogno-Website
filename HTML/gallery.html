<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il Sogno Gallery | Italian Restaurant Ambience & Cuisine</title>

    <meta name="description"
          content="Explore the Il Sogno gallery showcasing our Italian dishes, restaurant interior, and Amalfi Coast–inspired dining atmosphere.">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Il Sogno Gallery – Italian Dining Experience">
    <meta property="og:description"
          content="Discover the ambience, cuisine, and visual story behind Il Sogno Italian restaurant.">
    <meta property="og:image"
          content="photos/main_logo.png">
    <meta property="og:type" content="website">




    <link rel="stylesheet" href="../CSS/gallery.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="../Components/navbar.js" defer></script>
    <script type="module" src="../Components/footer.js" defer></script>
    <script src="../JS/gallery.js" defer></script>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
  </head>
  <body>
    <my-navbar></my-navbar>

    <section class="gallery_co">
      <video autoplay muted loop class="background_video">
        <source src="../photos/backVidGallery.mp4" type="video/mp4" />
      </video>

      <div class="gallery_header">
        <div class="gallery_text">
          <h1 id="gallery_title">Galleria dei Sogni</h1>
          <p id="gallery_desc">
            Step into a visual journey through Il Sogno - where art, flavor, and
            atmosphere come together. Each image captures a moment of
            inspiration, from the warm lights of our bar to the elegance of
            Italian craftsmanship.
          </p>
        </div>
      </div>
    </section>

    <section class="main_sec_images">
      <div class="main_sec_img_container">
        <div class="images_container" id="img1">
          <img
            src="../photos/719.webp"
            width="430"
            height="1000"
            class="images"
            loading="eager"
            fetchpriority="high"
            alt="Gallery image 1"
          />
        </div>

        <div class="images_container" id="img2">
          <img
            src="../photos/bar2.webp"
            width="860"
            height="400"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 2"
          />
        </div>

        <div class="images_container" id="img3">
          <img
            src="../photos/chandelier2.webp"
            width="430"
            height="600"
            class="images"
            loading="eager"
            fetchpriority="high"
            alt="Gallery image 3"
          />
        </div>

        <div class="images_container" id="img4">
          <img
            src="../photos/Canestra_di_frutta_(Caravaggio)2.webp"
            width="430"
            height="400"
            class="images"
            loading="eager"
            fetchpriority="high"
            alt="Gallery image 4"
          />
        </div>

        <div class="images_container" id="img5">
          <img
            src="../photos/jazzMusician2.webp"
            width="430"
            height="200"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 5"
          />
        </div>

        <div class="images_container" id="img6">
          <img
            src="../photos/vespa2.webp"
            width="430"
            height="400"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 6"
          />
        </div>

        <div class="images_container" id="img7">
          <img
            src="../photos/dine2.webp"
            width="430"
            height="400"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 7"
          />
        </div>

        <div class="images_container" id="img8">
          <img
            src="../photos/harp.webp"
            width="430"
            height="800"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 8"
          />
        </div>

        <div class="images_container" id="img9">
          <img
            src="../photos/people2.webp"
            width="860"
            height="400"
            class="images"
            loading="lazy"
            fetchpriority="high"
            alt="Gallery image 9"
          />
        </div>
      </div>
    </section>

    <my-footer></my-footer>
  </body>
</html>
