<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <link rel="stylesheet" href="../CSS/gallery.css">
    <script type="module" src="../Components/navbar.js" defer></script>
    <script type="module" src="../Components/footer.js" defer></script>
    <script src="../JS/gallery.js" defer></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Island+Moments&display=swap"
        rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<my-navbar></my-navbar>

<!-- Gallery Header -->
<section class="gallery_co">
    <video autoplay muted loop class="background_video">
        <source src="../photos/backVidGallery.mp4" type="video/mp4">
    </video>

    <div class="gallery_header">
        <div class="gallery_text">
            <p id="gallery_title"></p>
            <p id="gallery_desc">
            </p>
        </div>
    </div>
</section>

<!-- Main Image Grid -->
<section class="main_sec_images">

    <div class="images_container" id="img1">
        <img src="../photos/719.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 1">
    </div>
    <div class="images_container" id="img2">
        <img src="../photos/bar.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 2">
    </div>
    <div class="images_container" id="img3">
        <img src="../photos/chandelier.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 3">
    </div>
    <div class="images_container" id="img4">
        <img src="../photos/Canestra_di_frutta_(Caravaggio).jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 4">
    </div>
    <div class="images_container" id="img5">
        <img src="../photos/jazzMusician.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 5">
    </div>
    <div class="images_container" id="img6">
        <img src="../photos/vespa.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 6">
    </div>
    <div class="images_container" id="img7">
        <img src="../photos/dine.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 7">
    </div>
    <div class="images_container" id="img8">
        <img src="../photos/harp.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 8">
    </div>
    <div class="images_container" id="img9">
        <img src="../photos/people.jpg" class="images" loading="eager" fetchpriority="high" alt="Gallery image 9">
    </div>

</section>

<!-- Footer -->
<my-footer></my-footer>

</body>
</html>
